[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-processing"
version = "0.1.0"
description = "Invoice processing service — OCR, LLM extraction, validation"
requires-python = ">=3.12"
dependencies = [
    "invoice-shared",
]

[tool.setuptools.packages.find]
include = ["invoice_processing*"]
