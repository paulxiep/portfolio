services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: invoice_parse
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_parse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  processing:
    build:
      context: ..
      dockerfile: services/processing/Dockerfile
    env_file:
      - ../services/processing/.env
    volumes:
      - ../sample_invoice.pdf:/app/sample_invoice.pdf:ro
      - processing_output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - processing

volumes:
  pgdata:
  redisdata:
  processing_output:
